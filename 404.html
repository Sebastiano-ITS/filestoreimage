<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      font-size: 110px;
      font-weight: 900;
      letter-spacing: -5px;
      margin-bottom: 10px;
      text-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
    }

    .subtitle {
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: white;
      color: #1f2937;
      border-radius: 10px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }

    /* Animazione */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsivo */
    @media (max-width: 600px) {
      h1 {
        font-size: 70px;
        letter-spacing: -2px;
      }
      .subtitle {
        font-size: 18px;
      }
      .btn-home {
        padding: 10px 24px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>404</h1>
    <p class="subtitle">Oops! La pagina che cerchi non esiste.</p>
    <a href="dashboard.php" class="btn-home">Torna alla Home</a>
  </div>

</body>
</html>
